<!DOCTYPE html>

<title>学院事务咨询助手</title>
<style>
:root{--blue:#2E5C8A;--bg:#EAF1F8;--line:#C8D3E0;--green:#27AE60;--red:#C0392B;--gray:#6B7785;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#F4F7FB;color:#22303C;line-height:1.6;}
.header{background:var(--blue);color:#fff;padding:14px 16px;}
.header h1{font-size:17px;margin:0;}
.header p{font-size:12px;margin:4px 0 0;opacity:.9;}
.wrap{max-width:680px;margin:0 auto;padding:12px 12px 40px;}
.chat{min-height:120px;}
.q{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px;}
.a{background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:10px;padding:12px;margin:6px 0 16px;font-size:14px;}
.seg{margin:8px 0;}
.seg b{color:var(--blue);}
.seg.con b{color:var(--green);}
.basis{background:var(--bg);border-radius:8px;padding:8px 10px;margin-top:6px;font-size:12.5px;color:#33485C;}
.basis .c{margin:4px 0;}
.next{color:#33485C;}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;margin-left:6px;vertical-align:middle;}
.tag.ok{background:#E6F4EA;color:var(--green);}
.tag.no{background:#FBEAE7;color:var(--red);}
.tag.bd{background:#FFF4E0;color:#B7791F;}
.box{border-radius:10px;padding:12px;margin:6px 0 16px;font-size:14px;}
.box.boundary{background:#FFF4E0;border:1px solid #F0C36D;}
.box.reject{background:#FBEAE7;border:1px solid #E6A89C;}
.inputbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:8px 10px;display:flex;gap:8px;max-width:680px;margin:0 auto;}
.inputbar input{flex:1;border:1px solid var(--line);border-radius:20px;padding:10px 14px;font-size:14px;outline:none;}
.inputbar button{background:var(--blue);color:#fff;border:none;border-radius:20px;padding:0 18px;font-size:14px;}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
.btns button{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 10px;font-size:12px;color:#33485C;}
.foot{font-size:11px;color:var(--gray);text-align:center;margin-top:18px;}
</style>

<body>
<div class="header"><h1>学院事务咨询助手</h1><p>服务范围：补考／缓考／重修／成绩复核／奖助学金／宿舍与教室报修。资料以文件生效日期为准。</p></div>

</div>

<script>
const KB = {"meta": {"name": "学院事务咨询助手", "version": "2025-10", "source": "5份现行有效文件+FAQ（2023版已归档）"}, "clauses": [{"id": "JW-4", "file": "本科生课程考核与补缓考管理办法（2024年修订）", "version": "2024版", "clause": "第四条", "text": "学生应于成绩公布后5个工作日内通过教务系统提交补考申请。逾期系统自动关闭，不再受理。", "keywords": ["补考", "申请", "提交", "多久", "几天", "截止", "5个工作日", "教务系统", "逾期"], "category": "补缓考"}, {"id": "JW-5", "file": "本科生课程考核与补缓考管理办法（2024年修订）", "version": "2024版", "clause": "第五条", "text": "补考一般安排在新学期开学后第3周至第4周进行，具体时间以教务处当期通知为准。", "keywords": ["补考", "第几周", "几周", "什么时候考", "开学后", "3周", "4周"], "category": "补缓考"}, {"id": "JW-6-1", "file": "本科生课程考核与补缓考管理办法（2024年修订）", "version": "2024版", "clause": "第六条第（一）项", "text": "实践类课程（含实习、实验、课程设计、毕业设计）不合格的，不予补考，须重修。", "keywords": ["实习", "实践", "实验", "课程设计", "毕业设计", "挂了", "不合格", "补考", "不予", "须重修"], "category": "补缓考"}, {"id": "JW-6-2", "file": "本科生课程考核与补缓考管理办法（2024年修订）", "version": "2024版", "clause": "第六条第（二）项", "text": "无故旷考、考试违纪或作弊的，不予补考，须重修。", "keywords": ["旷考", "违纪", "作弊", "补考", "不予", "重修"], "category": "补缓考"}, {"id": "JW-6-3", "file": "本科生课程考核与补缓考管理办法（2024年修订）", "version": "2024版", "clause": "第六条第（三）项", "text": "补考后仍不合格的，不予再次补考，须重修。", "keywords": ["补考", "没过", "再补", "再次", "不予", "重修"], "category": "补缓考"}, {"id": "JW-7", "file": "本科生课程考核与补缓考管理办法（2024年修订）", "version": "2024版", "clause": "第七条", "text": "补考成绩按实际得分记载，成绩单标注“补考”字样。补考成绩合格即取得该课程学分。", "keywords": ["补考", "成绩单", "标注", "补考字样"], "category": "补缓考"}, {"id": "JW-8", "file": "本科生课程考核与补缓考管理办法（2024年修订）", "version": "2024版", "clause": "第八条", "text": "缓考申请条件：因疾病、家庭重大变故等不可抗力确实无法参加期末考核的，可以申请缓考。", "keywords": ["缓考", "条件", "疾病", "家庭重大变故", "不可抗力"], "category": "补缓考"}, {"id": "JW-9", "file": "本科生课程考核与补缓考管理办法（2024年修订）", "version": "2024版", "clause": "第九条", "text": "应在课程考核开始前通过教务系统提交缓考申请，并上传二级甲等以上医院诊断证明或相关证明材料，经所在学院审核、教务处审批后准予缓考。突发情况无法事前申请的，应于考核结束后3个工作日内补办。", "keywords": ["缓考", "材料", "证明", "医院", "二级甲等", "提交", "考核前", "教务系统", "补办", "3个工作日"], "category": "补缓考"}, {"id": "JW-10", "file": "本科生课程考核与补缓考管理办法（2024年修订）", "version": "2024版", "clause": "第十条", "text": "缓考与补考同期进行，缓考成绩按实际得分记载，成绩单不标注“缓考”字样。", "keywords": ["缓考", "成绩单", "标注", "缓考字样", "保研"], "category": "补缓考"}, {"id": "JW-11", "file": "本科生课程考核与补缓考管理办法（2024年修订）", "version": "2024版", "clause": "第十一条", "text": "未办理缓考手续且未参加考核的，按旷考处理。", "keywords": ["缓考", "没去", "缺考", "旷考", "未办理"], "category": "补缓考"}, {"id": "JW-12", "file": "本科生课程考核与补缓考管理办法（2024年修订）", "version": "2024版", "clause": "第十二条", "text": "应予重修的情形包括：补考后仍不合格；属于第六条规定不予补考的情形；缓考后仍不合格。", "keywords": ["重修", "情形", "补考后仍不合格", "缓考后仍不合格"], "category": "补缓考"}, {"id": "JW-14", "file": "本科生课程考核与补缓考管理办法（2024年修订）", "version": "2024版", "clause": "第十四条", "text": "同一门课程在校期间重修不超过2次；第2次重修仍不合格的，按结业处理，可在最长学习年限内申请换发毕业证书。", "keywords": ["重修", "次数", "最多", "几次", "不超过2次", "结业", "换发毕业证书"], "category": "补缓考"}, {"id": "JW-15", "file": "本科生课程考核与补缓考管理办法（2024年修订）", "version": "2024版", "clause": "第十五条", "text": "重修不额外收取学费。", "keywords": ["重修", "学费", "交钱", "收取", "额外"], "category": "补缓考"}, {"id": "JW-16", "file": "本科生课程考核与补缓考管理办法（2024年修订）", "version": "2024版", "clause": "第十六条", "text": "成绩复核仅核查漏评、错统、错登三类情形，不重新评阅答卷，不对评分标准与评分尺度作出评价。", "keywords": ["复核", "重新", "看卷", "评阅", "答卷", "漏评", "错统", "错登"], "category": "补缓考"}, {"id": "JW-17", "file": "本科生课程考核与补缓考管理办法（2024年修订）", "version": "2024版", "clause": "第十七条", "text": "对成绩有异议的，应于成绩公布后10个工作日内向开课学院提交书面复核申请。", "keywords": ["复核", "异议", "成绩", "10个工作日", "书面", "开课学院"], "category": "补缓考"}, {"id": "JW-19", "file": "本科生课程考核与补缓考管理办法（2024年修订）", "version": "2024版", "clause": "第十九条", "text": "毕业年级学生的补考，应安排在毕业学期第6周前完成。", "keywords": ["毕业班", "毕业年级", "最晚", "第6周", "毕业学期"], "category": "补缓考"}, {"id": "XS-5", "file": "本专科学生奖助学金评审与发放办法（2025年修订）", "version": "2025版", "clause": "第五条", "text": "国家奖学金：适用于二年级以上（含二年级）学生。上一学年学业成绩排名与综合考评排名均位于前10%，且无不及格科目。奖励标准为8000元／生／学年，一次性发放。", "keywords": ["国家奖学金", "8000", "前10%", "二年级以上", "条件", "奖励标准"], "category": "奖助学金"}, {"id": "XS-6", "file": "本专科学生奖助学金评审与发放办法（2025年修订）", "version": "2025版", "clause": "第六条", "text": "国家励志奖学金：适用于家庭经济困难学生（须经学院家庭经济困难认定）。上一学年学业成绩排名位于前30%，且无不及格科目。奖励标准为5000元／生／学年 }
function ask(){
  const inp=document.getElementById("inp");const q=norm(inp.value.trim());
  if(!q)return;
  const chat=document.getElementById("chat");
  chat.innerHTML+='<div class="q">'+escapeHtml(inp.value.trim())+'</div>';
  const r=classify(q);
  const cls=r.type==="boundary"?"box boundary":(r.type==="reject"?"box reject":"a");
  const tag=r.type==="ok"?'<span class="tag ok">已作答</span>':(r.type==="reject"?'<span class="tag no">已拒答</span>':'<span class="tag bd">边界</span>');
  chat.innerHTML+='<div class="'+cls+'">'+renderAnswer(r)+tag+'</div>';
  chat.scrollTop=chat.scrollHeight;inp.value="";
}
const samples=["补考申请要在多久内提交？","缓考要交什么材料？","国家奖学金多少钱？","宿舍漏水怎么报修？","教室投影打不开找谁？","交换生的学分怎么认定？","我压力大睡不着吃什么药好？"];
const sb=document.getElementById("samples");
samples.forEach(s=>{const b=document.createElement("button");b.textContent=s;b.onclick=()=>{document.getElementById("inp").value=s;ask();};sb.appendChild(b);});
</script>
